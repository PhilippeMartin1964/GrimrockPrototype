<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <style>
    .box { fill:#172033; stroke:#63b3ed; stroke-width:2; rx:10; }
    .effect { fill:#16352b; stroke:#68d391; stroke-width:2; rx:10; }
    .text { fill:#f7fafc; font:15px sans-serif; text-anchor:middle; }
    .small { fill:#cbd5e0; font:12px sans-serif; text-anchor:middle; }
    .arrow { stroke:#a0aec0; stroke-width:2; marker-end:url(#a); }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a0aec0"/></marker></defs>
  <rect class="box" x="30" y="80" width="190" height="150"/>
  <text class="text" x="125" y="110">Événements source</text>
  <text class="small" x="125" y="142">ItemInserted</text><text class="small" x="125" y="167">ItemRemoved</text><text class="small" x="125" y="192">ItemChanged</text>
  <rect class="box" x="270" y="105" width="150" height="100"/>
  <text class="text" x="345" y="140">Liens sortants</text><text class="small" x="345" y="168">SourceEvent</text>
  <rect class="box" x="470" y="65" width="210" height="180"/>
  <text class="text" x="575" y="95">Condition sur la cible</text>
  <text class="small" x="575" y="125">vide / présence</text><text class="small" x="575" y="148">définition / tag / type</text>
  <text class="small" x="575" y="171">nombre / poids</text><text class="small" x="575" y="207">inversion après validation</text>
  <rect class="box" x="730" y="65" width="200" height="180"/>
  <text class="text" x="830" y="95">Commande cible</text>
  <text class="small" x="830" y="125">Consume / ConsumeAll</text><text class="small" x="830" y="150">Lock / Unlock</text>
  <text class="small" x="830" y="175">Enable / Disable Removal</text><text class="small" x="830" y="207">ou commande de porte</text>
  <rect class="effect" x="970" y="105" width="110" height="100"/>
  <text class="text" x="1025" y="138">Effet</text><text class="small" x="1025" y="165">contenu, verrou,</text><text class="small" x="1025" y="185">retrait ou porte</text>
  <line class="arrow" x1="220" y1="155" x2="270" y2="155"/><line class="arrow" x1="420" y1="155" x2="470" y2="155"/>
  <line class="arrow" x1="680" y1="155" x2="730" y2="155"/><line class="arrow" x1="930" y1="155" x2="970" y2="155"/>
  <text class="small" x="550" y="300">Une condition invalide arrête le lien avant bInvertCondition.</text>
  <text class="small" x="550" y="325">Le réceptacle émet les événements ; le composant d'activation filtre et applique la commande.</text>
</svg>
