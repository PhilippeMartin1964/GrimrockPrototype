<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230">
  <style>.box{fill:#182230;stroke:#58a6ff;stroke-width:2}.txt{fill:#f0f6fc;font:18px Arial,sans-serif;text-anchor:middle}.sub{fill:#9da7b3;font:14px Arial,sans-serif;text-anchor:middle}.arrow{stroke:#8b949e;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="230" rx="16" fill="#0d1117"/>
  <rect class="box" x="30" y="70" width="180" height="80" rx="10"/><text class="txt" x="120" y="105">Clic sur panneau</text><text class="sub" x="120" y="130">CanInteract + Read</text>
  <line class="arrow" x1="210" y1="110" x2="270" y2="110"/>
  <rect class="box" x="275" y="70" width="190" height="80" rx="10"/><text class="txt" x="370" y="105">ShowReadableMessage</text><text class="sub" x="370" y="130">création ou mise à jour</text>
  <line class="arrow" x1="465" y1="110" x2="525" y2="110"/>
  <rect class="box" x="530" y="70" width="175" height="80" rx="10"/><text class="txt" x="617" y="105">Message persistant</text><text class="sub" x="617" y="130">sans autofermeture</text>
  <line class="arrow" x1="705" y1="110" x2="765" y2="110"/>
  <rect class="box" x="770" y="55" width="160" height="110" rx="10"/><text class="txt" x="850" y="92">Fermeture</text><text class="sub" x="850" y="117">clic, mouvement,</text><text class="sub" x="850" y="138">rotation ou action</text>
</svg>
