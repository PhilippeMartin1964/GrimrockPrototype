       width="200"
       height="170"
       rx="18"
       id="rect6" />
    <text
       class="label"
       x="55"
       y="42"
       id="text7">Palette</text>
    <text
       class="code"
       x="27"
       y="78"
       id="text8">ApplyPaletteEntry()</text>
    <text
       class="small"
       x="30"
       y="111"
       id="text9">sélectionne l’archétype</text>
    <text
       class="small"
       x="30"
       y="139"
       id="text10">et l’outil PaintObject</text>
  </g>
