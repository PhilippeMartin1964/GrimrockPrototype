     width="1200"
     height="720"
     id="rect2" />
  <text
     class="title"
     x="60"
     y="70"
     id="text2">Édition → donnée persistante → aperçu → runtime</text>
  <text
     class="note"
     x="60"
     y="105"
     id="text3">L’aperçu et le runtime relisent la même source persistante, mais ne génèrent pas les mêmes acteurs.</text>
  <g
