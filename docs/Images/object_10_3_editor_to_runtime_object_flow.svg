       x="38"
       y="43"
       id="text4">Utilisateur</text>
    <text
       class="small"
       x="28"
       y="78"
       id="text5">clic palette</text>
    <text
       class="small"
       x="28"
       y="104"
       id="text6">puis viewport</text>
  </g>
  <path
     class="arrow"
     d="M235 275 H290"
