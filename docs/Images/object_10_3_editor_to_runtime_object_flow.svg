       height="170"
       rx="18"
       id="rect10" />
    <text
       class="label"
       x="26"
       y="42"
       id="text11">AGridLevelEditorActor</text>
    <text
       class="code"
       x="35"
       y="78"
       id="text12">PlaceSelectedObject()</text>
    <text
       class="small"
       x="34"
       y="111"
       id="text13">construit la donnée</text>
    <text
       class="small"
       x="34"
       y="139"
       id="text14">et demande son ajout</text>
  </g>
