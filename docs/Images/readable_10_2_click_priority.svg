<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310">
  <style>.box{fill:#182230;stroke:#58a6ff;stroke-width:2}.decision{fill:#202b3a;stroke:#d29922;stroke-width:2}.txt{fill:#f0f6fc;font:17px Arial,sans-serif;text-anchor:middle}.small{fill:#9da7b3;font:14px Arial,sans-serif;text-anchor:middle}.arrow{stroke:#8b949e;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="310" rx="16" fill="#0d1117"/>
  <rect class="box" x="30" y="110" width="130" height="65" rx="10"/><text class="txt" x="95" y="150">Clic gauche</text>
  <line class="arrow" x1="160" y1="142" x2="220" y2="142"/>
  <rect class="decision" x="225" y="95" width="190" height="95" rx="10"/><text class="txt" x="320" y="132">Message actif ?</text><text class="small" x="320" y="160">priorité absolue</text>
  <line class="arrow" x1="320" y1="95" x2="320" y2="45"/><text class="small" x="347" y="69">oui</text>
  <rect class="box" x="230" y="10" width="180" height="45" rx="10"/><text class="small" x="320" y="38">Fermer et consommer</text>
  <line class="arrow" x1="415" y1="142" x2="475" y2="142"/><text class="small" x="445" y="130">non</text>
  <rect class="decision" x="480" y="95" width="180" height="95" rx="10"/><text class="txt" x="570" y="132">Item au curseur ?</text><text class="small" x="570" y="160">dépôt direct</text>
  <line class="arrow" x1="570" y1="190" x2="570" y2="245"/><text class="small" x="595" y="220">oui</text>
  <rect class="box" x="485" y="250" width="170" height="45" rx="10"/><text class="small" x="570" y="278">Tenter le dépôt</text>
  <line class="arrow" x1="660" y1="142" x2="720" y2="142"/><text class="small" x="690" y="130">non</text>
  <rect class="box" x="725" y="95" width="205" height="95" rx="10"/><text class="txt" x="827" y="132">Interaction directe</text><text class="small" x="827" y="160">ou aucune action</text>
