  <circle class="party" cx="170" cy="225" r="34"/><text class="t" x="140" y="232">Groupe</text><path d="M170 180v-42" stroke="#0969da" stroke-width="6"/><path d="M158 150l12-18 12 18" fill="none" stroke="#0969da" stroke-width="6"/>
