<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>.t{font:18px Arial;fill:#18212b}.s{font:15px Arial;fill:#425466}.cell{fill:#eef3f7;stroke:#627d98;stroke-width:2}.ok{fill:#d7f5df;stroke:#238636;stroke-width:3}.party{fill:#dbeafe;stroke:#0969da;stroke-width:3}</style>
  <text class="t" x="28" y="34">Règles d'accessibilité selon la cellule et l'arête</text>
