<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <style>.t{font:18px Arial;fill:#18212b}.s{font:15px Arial;fill:#425466}.b{fill:#eef3f7;stroke:#57606a;stroke-width:2}.a{stroke:#0969da;stroke-width:3;fill:none;marker-end:url(#m)}.r{stroke:#cf222e;stroke-width:3;fill:none}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0969da"/></marker></defs>
  <text class="t" x="30" y="34">Le curseur est un propriétaire logique temporaire</text>
  <rect class="b" x="45" y="120" width="190" height="80"/><text class="t" x="95" y="166">Inventaire</text>
  <rect class="b" x="395" y="120" width="190" height="80"/><text class="t" x="450" y="166">Curseur</text>
  <rect class="b" x="745" y="120" width="190" height="80"/><text class="t" x="785" y="166">Réceptacle</text>
  <path class="a" d="M235 140H395"/><path class="a" d="M395 184H235"/><path class="a" d="M585 140H745"/><path class="a" d="M745 184H585"/>
