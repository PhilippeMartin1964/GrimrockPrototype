<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <style>
    .title { fill:#f7fafc; font:bold 18px sans-serif; text-anchor:middle; }
    .text { fill:#edf2f7; font:14px sans-serif; text-anchor:middle; }
    .small { fill:#cbd5e0; font:12px sans-serif; text-anchor:middle; }
    .criteria { fill:#183153; stroke:#63b3ed; stroke-width:2; rx:10; }
    .block { fill:#3b2025; stroke:#fc8181; stroke-width:2; rx:10; }
    .invalid { fill:#3c3420; stroke:#f6e05e; stroke-width:2; rx:10; }
    .result { fill:#16352b; stroke:#68d391; stroke-width:2; rx:10; }
    .arrow { stroke:#a0aec0; stroke-width:2; marker-end:url(#a); }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a0aec0"/></marker></defs>
  <text class="title" x="500" y="30">Évaluation ordonnée de l'acceptation</text>
  <rect class="block" x="30" y="70" width="260" height="145"/>
  <text class="title" x="160" y="98">États bloquants</text>
  <text class="text" x="160" y="128">Instance invalide</text><text class="text" x="160" y="153">Capacité atteinte</text>
  <text class="text" x="160" y="178">Insertion désactivée</text><text class="text" x="160" y="203">Identifiant rejeté</text>
  <rect class="criteria" x="370" y="70" width="260" height="180"/>
  <text class="title" x="500" y="98">Critères alternatifs</text>
  <text class="text" x="500" y="128">AcceptAny effectif</text><text class="text" x="500" y="153">ItemDefinitionId</text>
  <text class="text" x="500" y="178">Tag de définition</text><text class="text" x="500" y="203">ItemType de définition</text>
  <text class="small" x="500" y="230">Une correspondance suffit.</text>
  <rect class="invalid" x="710" y="70" width="260" height="145"/>
  <text class="title" x="840" y="98">Données non résolues</text>
  <text class="text" x="840" y="132">Définition absente :</text><text class="text" x="840" y="157">tag et type inutilisables</text>
  <text class="small" x="840" y="188">AcceptAny et identifiant restent possibles.</text>
  <rect class="result" x="350" y="330" width="300" height="65"/>
  <text class="title" x="500" y="360">Accepté</text><text class="small" x="500" y="382">MatchedRule journalisée</text>
  <rect class="block" x="30" y="330" width="230" height="65"/>
  <text class="title" x="145" y="360">Refus immédiat</text><text class="small" x="145" y="382">RejectReason journalisé</text>
  <rect class="block" x="740" y="330" width="230" height="65"/>
  <text class="title" x="855" y="360">Aucune règle</text><text class="small" x="855" y="382">NoMatchingAcceptanceRule</text>
  <line class="arrow" x1="160" y1="215" x2="145" y2="330"/><line class="arrow" x1="500" y1="250" x2="500" y2="330"/>
  <line class="arrow" x1="840" y1="215" x2="855" y2="330"/>
  <text class="small" x="500" y="292">Ni le poids ni l'autorisation de retrait ne sont des critères d'acceptation.</text>
</svg>
