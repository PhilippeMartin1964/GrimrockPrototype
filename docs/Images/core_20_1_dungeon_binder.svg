<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GridDungeonAsset comme classeur de niveaux</title>
  <desc id="desc">Illustration montrant un GridDungeonAsset comme un classeur contenant plusieurs entrées de niveau qui référencent des GridLevelAsset.</desc>
  <defs>
    <style>
      .bg{fill:#f7f1e6}.panel{fill:#fffaf0;stroke:#5b4636;stroke-width:3}.binder{fill:#7d3f2f;stroke:#3a211b;stroke-width:4}.spine{fill:#5a2d25}.tab{fill:#e8c27a;stroke:#5b4636;stroke-width:2}.map{fill:#d7e8cf;stroke:#4e6848;stroke-width:3}.grid{stroke:#8aa37d;stroke-width:1}.title{font:700 34px Georgia,serif;fill:#2c1e18}.label{font:700 24px Arial,sans-serif;fill:#2c1e18}.small{font:18px Arial,sans-serif;fill:#2c1e18}.note{font:16px Arial,sans-serif;fill:#5b4636}.arrow{stroke:#3d5f7a;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#3d5f7a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="title" x="60" y="70">Le donjon comme classeur</text>
  <text class="note" x="60" y="105">Le DungeonAsset organise les niveaux, mais ne stocke pas directement la grille.</text>

  <rect class="binder" x="90" y="160" width="420" height="430" rx="24"/>
  <rect class="spine" x="90" y="160" width="86" height="430" rx="20"/>
  <circle cx="132" cy="260" r="14" fill="#d9b36c" stroke="#3a211b" stroke-width="3"/>
  <circle cx="132" cy="365" r="14" fill="#d9b36c" stroke="#3a211b" stroke-width="3"/>
  <circle cx="132" cy="470" r="14" fill="#d9b36c" stroke="#3a211b" stroke-width="3"/>
  <text class="label" x="205" y="230">UGridDungeonAsset</text>
  <text class="small" x="205" y="270">DungeonName</text>
  <text class="small" x="205" y="305">DefaultLevelId</text>
  <text class="small" x="205" y="340">Levels[]</text>

  <rect class="tab" x="430" y="240" width="170" height="58" rx="12"/>
  <text class="small" x="452" y="276">Floor_00</text>
  <rect class="tab" x="430" y="330" width="170" height="58" rx="12"/>
  <text class="small" x="452" y="366">Floor_01</text>
  <rect class="tab" x="430" y="420" width="170" height="58" rx="12"/>
  <text class="small" x="452" y="456">Floor_02</text>

  <path class="arrow" d="M610 270 C670 250,710 235,760 230"/>
  <path class="arrow" d="M610 360 C675 360,710 360,760 360"/>
  <path class="arrow" d="M610 450 C670 470,710 485,760 490"/>

  <g transform="translate(770,165)">
    <rect class="map" x="0" y="0" width="350" height="150" rx="14"/>
    <text class="label" x="26" y="42">GridLevelAsset</text>
    <text class="small" x="26" y="78">DA_Level_Floor_00</text>
    <g transform="translate(220,35)">
      <rect x="0" y="0" width="90" height="90" fill="#eff7ec" stroke="#4e6848" stroke-width="2"/>
      <path class="grid" d="M30 0 V90 M60 0 V90 M0 30 H90 M0 60 H90"/>
    </g>
  </g>
  <g transform="translate(770,330)">
    <rect class="map" x="0" y="0" width="350" height="150" rx="14"/>
    <text class="label" x="26" y="42">GridLevelAsset</text>
    <text class="small" x="26" y="78">DA_Level_Floor_01</text>
    <g transform="translate(220,35)">
      <rect x="0" y="0" width="90" height="90" fill="#eff7ec" stroke="#4e6848" stroke-width="2"/>
      <path class="grid" d="M30 0 V90 M60 0 V90 M0 30 H90 M0 60 H90"/>
    </g>
  </g>
  <g transform="translate(770,495)">
    <rect class="map" x="0" y="0" width="350" height="150" rx="14"/>
    <text class="label" x="26" y="42">GridLevelAsset</text>
    <text class="small" x="26" y="78">DA_Level_Floor_02</text>
    <g transform="translate(220,35)">
      <rect x="0" y="0" width="90" height="90" fill="#eff7ec" stroke="#4e6848" stroke-width="2"/>
      <path class="grid" d="M30 0 V90 M60 0 V90 M0 30 H90 M0 60 H90"/>
    </g>
  </g>
</svg>
