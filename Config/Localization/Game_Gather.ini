; UI-LOCALIZATION02.2
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=fr
CulturesToGenerate=fr
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/GrimrockPrototype
ExcludePathFilters=Source/GrimrockPrototype/Private/Tests/*
ExcludePathFilters=Source/GrimrockPrototype/Private/RPG/RPGProgressionPIESimulator.*
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/Localization/StringTables/*
IncludePathFilters=Content/GrimrockPrototype/Core/DataAssets/*
IncludePathFilters=Content/GrimrockPrototype/Monsters/Categories/*
IncludePathFilters=Content/GrimrockPrototype/Monsters/*/Data/*
IncludePathFilters=Content/GrimrockPrototype/Blueprints/UI/*
IncludePathFilters=Content/GrimrockPrototype/Blueprints/Runtime/*
IncludePathFilters=Content/GrimrockPrototype/Maps/*
ExcludePathFilters=Content/GrimrockPrototype/Core/DataAssets/Items/DA_Item_TestNote*
ExcludePathFilters=Content/GrimrockPrototype/Core/DataAssets/Readables/*_Test*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
