; UI-RPG-PACK01: runtime-loaded via AssetManager/LoadObject; PIE visibility alone does not cook assets.
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/RPG/Skills")
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/UI/RPG")
; Serialized production Spell DataAssets are loaded by FGridProductionSpellLibrary.
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/Magic/Spells")
; Class visual PrimaryDataAssets are resolved at runtime by ClassId.
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/RPG/Visuals/ClassVisuals")
; Item registry, catalogues and definitions; old path retained for compatibility redirectors.
; SaveGame v27 retains references to these two protected readable fixtures.
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/Tests/Readables")
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/Items")
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Core/DataAssets/CanonicalStage")
; ARMEMENT01.17.1.4.SHIPPING01: Oil decal master and instance dynamically loaded by C++.
+DirectoriesToAlwaysCook=(Path="/Game/GrimrockPrototype/Art/Materials/Surfaces")

; UI-LOCALIZATION01: generated ST_UI is loaded by runtime localization resolver.
+DirectoriesToAlwaysCook=(Path="/Game/Localization/StringTables")

[Internationalization]
+LocalizationPaths=%GAMEDIR%Content/Localization/Game

